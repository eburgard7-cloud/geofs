# Merge into /mnt/user/appdata/stack/docker-compose.yml (services: section).
# Copy race/server/ and race/courses/ to /mnt/user/appdata/stack/race-api/race/{server,courses}/
# first (DEPLOY_CHECKLIST.md section 1): the image is built from that repo-shaped directory.
  race-api:
    build:
      context: ./race-api
      dockerfile: race/server/Dockerfile
    container_name: race-api
    restart: unless-stopped
    environment:
      RACE_ORIGINS: https://www.geo-fs.com,https://geo-fs.com
      RACE_MAX_SPEED_MS: "700"
      RACE_MIN_INTERVAL_S: "5"
      RACE_COURSES_DIR: /app/courses
    volumes:
      - /mnt/user/appdata/race-api:/data
      - ./race-api/race/courses:/app/courses:ro
    networks:
      - proxy
