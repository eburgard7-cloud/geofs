# Merge into /mnt/user/appdata/stack/docker-compose.yml (services: section).
# Copy race/server/, race/courses/ and race/runways/ to /mnt/user/appdata/stack/race-api/race/{server,courses,runways}/
# first (docs/RUNBOOK.md, "First-time or manual deploy"): the image is built from that repo-shaped directory.
  race-api:
    build:
      context: ./race-api
      dockerfile: race/server/Dockerfile
      args:
        # export GIT_SHA=$(git -C race-api rev-parse HEAD) before `docker compose up -d --build`,
        # or GET /version reports "unknown" for this build.
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: race-api
    restart: unless-stopped
    environment:
      RACE_ORIGINS: https://www.geo-fs.com,https://geo-fs.com
      RACE_MAX_SPEED_MS: "700"
      RACE_MIN_INTERVAL_S: "5"
      RACE_COURSES_DIR: /app/courses
      RACE_RUNWAYS_DIR: /app/runways
      # Tile proxy (race/server/app.py): defaults are already right for this layout (RACE_TILE_CACHE_DIR
      # defaults to /data/tiles, under the volume below; RACE_TILE_PROXY defaults on; RACE_IMAGERY
      # defaults to esri). Uncomment only to change them:
      # RACE_TILE_CACHE_MB: "2048"
      # RACE_IMAGERY: eox
    volumes:
      - /mnt/user/appdata/race-api:/data
      - ./race-api/race/courses:/app/courses:ro
      - ./race-api/race/runways:/app/runways:ro
    networks:
      - proxy
