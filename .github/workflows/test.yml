name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  race-js:
    name: race/ JS test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: race/test/package-lock.json
      - run: npm ci
        working-directory: race/test
      - run: node run.js
        working-directory: race/test

  race-server:
    name: race/server pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: race/server/requirements.txt
      - run: pip install -r race/server/requirements.txt httpx pytest
      - run: python -m pytest race/test/test_server.py -q

  race-server-smoke:
    name: race/server site smoke test (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: race/server/requirements.txt
      - run: pip install -r race/server/requirements.txt httpx pytest playwright
      - run: python -m playwright install --with-deps chromium
      # Guards against the site silently falling back to its 2D map (a stale rate limiter, a CSP
      # regression, a broken model mount all look identical from a unit test: nothing throws, the
      # page just quietly ships the fallback). See race/test/site_smoke.py's module docstring.
      - run: python -m pytest race/test/site_smoke.py -q

  ruff:
    name: ruff lint (race/server, race/tools)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install ruff
      - run: ruff check race/server race/tools

  shellcheck:
    name: shellcheck (race/server deploy scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck race/server/redeploy.sh race/server/autodeploy.sh race/server/prune.sh

  docker-tile-cache:
    name: "docker (redeploy.sh layout): tile cache must be writable"
    runs-on: ubuntu-latest
    # Reproduces the 2026-09-24 incident exactly: redeploy.sh step 5 runs this image as --user
    # 99:100 with a host dir bind-mounted at /app/data (RACE_DB=/app/data/race.db) and NO mount at
    # /data at all. On unpatched main the Dockerfile hardcodes RACE_TILE_CACHE_DIR=/data/tiles and
    # declares VOLUME /data, so that path lands on an anonymous, root-owned volume the 99:100 user
    # can't write -- this job fails there. No dependency on upstream tile hosts: it only checks
    # /health's tiles.cache_writable, never fetches an actual tile.
    steps:
      - uses: actions/checkout@v4
      - name: Build the image (repo root, as redeploy.sh step 4 does)
        run: docker build -f race/server/Dockerfile --build-arg "GIT_SHA=${{ github.sha }}" -t race .
      - name: Run it exactly as redeploy.sh step 5 does, minus the courses/runways/models mounts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/race-data"
          sudo chown 99:100 "$RUNNER_TEMP/race-data"
          docker run -d --name race --restart unless-stopped --user 99:100 \
            -v "$RUNNER_TEMP/race-data:/app/data" -e RACE_DB=/app/data/race.db \
            -p 8000:8000 race
      - name: Poll /health and assert tiles.cache_writable
        run: |
          set -euo pipefail
          DEADLINE=$(( $(date +%s) + 30 ))
          STATUS="000"
          BODY=""
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            BODY="$(curl -sS -m 5 -w '\n%{http_code}' http://localhost:8000/health || printf '\n000')"
            STATUS="${BODY##*$'\n'}"
            echo "  /health -> $STATUS ${BODY%$'\n'*}"
            if [ "$STATUS" = "200" ]; then
              break
            fi
            if [ "$STATUS" != "502" ] && [ "$STATUS" != "000" ]; then
              break
            fi
            sleep 2
          done
          if [ "$STATUS" != "200" ]; then
            echo "server never answered /health (last status $STATUS)" >&2
            docker logs race
            exit 1
          fi
          CACHE_WRITABLE="$(printf '%s' "$BODY" | grep -o '"cache_writable":[a-z]*' | cut -d: -f2 || true)"
          if [ "$CACHE_WRITABLE" != "true" ]; then
            echo "tiles.cache_writable=${CACHE_WRITABLE:-absent}, expected true" >&2
            docker logs race
            exit 1
          fi
          echo "tiles.cache_writable is true"
      - name: Container logs
        if: always()
        run: docker logs race || true
